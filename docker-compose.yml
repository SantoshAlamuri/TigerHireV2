# Local development: Postgres only (for DB migrations and app against local DB).
# For full Supabase (Auth, Storage, etc.) use: npx supabase start
# Then set NEXT_PUBLIC_SUPABASE_URL and keys from `npx supabase status`.

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "54322:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
