openapi: 3.0.3
info:
  title: TigerHire API
  description: |
    Internal API for TigerHire. Most routes require a Supabase Auth session (cookie).

    **Per-job knockout (yes/no) screening:** When a job has active `job_screening_questions`, clients must
    pass `screeningAnswers` (array of `{ questionId, answerYes }`) on `POST /api/applications`, or
    the `screeningAnswers` form field (JSON string) on `POST /api/apply` when applying with
    a `jobId`. Public question text (no “fail” metadata) is returned from `GET /api/apply/{slug}?job=`
    and `GET /api/jobs/{id}/public-screening-questions`. Recruiters manage questions via
    `GET/POST /api/jobs/{id}/screening-questions` and `GET/PATCH/DELETE .../screening-questions/{qid}`.
  version: 1.0.0

servers:
  - url: /
    description: Relative to app origin (NEXT_PUBLIC_APP_URL)

paths:
  /api/health:
    get:
      summary: Liveness / Readiness
      parameters:
        - name: ready
          in: query
          schema: { type: string, enum: ["1"] }
          description: If set, readiness check (DB ping); otherwise liveness.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { ok: { type: boolean } } }
        "503":
          description: Not ready (when ready=1 and DB unavailable)

  /api/auth/login:
    post:
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200":
          description: Success with user, role, redirectTo
        "401":
          description: Invalid credentials

  /api/candidates:
    get:
      summary: List candidates (recruiter/company_admin)
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: cursor
          in: query
          schema: { type: string, format: uuid }
          description: Cursor for next page (from previous response pagination.nextCursor)
        - name: search
          in: query
          schema: { type: string }
        - name: sortBy
          in: query
          schema: { type: string, enum: [intent_score, experience_years, created_at] }
        - name: sortOrder
          in: query
          schema: { type: string, enum: [asc, desc] }
      responses:
        "200":
          description: List with pagination (candidates, pagination.page, pagination.limit, pagination.total, pagination.nextCursor)
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  /api/jobs:
    get:
      summary: List jobs
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: cursor
          in: query
          schema: { type: string }
          description: Cursor (created_at) for next page
        - name: status
          in: query
          schema: { type: string, enum: [draft, open, closed] }
        - name: search
          in: query
          schema: { type: string }
      responses:
        "200":
          description: List with pagination (jobs, pagination.nextCursor)
        "401":
          description: Unauthorized

  /api/applications:
    get:
      summary: "List applications (candidate: own; recruiter: org)"
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
        - name: cursor
          in: query
          schema: { type: string }
          description: Cursor (created_at) for next page
        - name: status
          in: query
          schema: { type: string }
        - name: jobId
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: List with pagination (applications, pagination.nextCursor)
        "401":
          description: Unauthorized
    post:
      summary: Apply to a job (candidate)
      description: |
        If the job has **active** knockout questions, the body must include `screeningAnswers` for every
        question; otherwise 400/403. Answers are stored on `application_screening_answers`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateApplicationRequest" }
      responses:
        "201":
          description: Application created
        "400":
          description: Validation, screening incomplete, or job not open
        "401":
          description: Unauthorized
        "403":
          description: Screening failed (not passed), cooling off, or forbidden
        "409":
          description: Already applied

  /api/applications/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Single application (with optional screening answer snapshot)
      description: |
        `screeningAnswers` is an array of `{ questionId, questionText, failOnYes, sortOrder, answerYes, passed }` when
        the application has stored knockout responses; empty array if none. Same auth rules as the application.
      responses:
        "200":
          description: "{ application, screeningAnswers }"
        "401":
          description: Unauthorized
        "404":
          description: Not found

  /api/jobs/{id}/public-screening-questions:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: Job id
    get:
      summary: Public screening questions for a candidate (open job only)
      description: |
        Logged-in candidate. Returns `questionText` and `sortOrder` per question, not which answer fails.
      responses:
        "200":
          description: "{ data: { questions: [...] } }"
        "401":
          description: Unauthorized
        "404":
          description: Job not found or not open

  /api/jobs/{id}/screening-questions:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: List screening questions (recruiter)
      responses:
        "200":
          description: Full question rows (incl. failOnYes, isActive)
        "401":
          description: Unauthorized
    post:
      summary: Add screening question (recruiter / company admin)
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateJobScreeningQuestion" }
      responses:
        "201":
          description: Created
        "400":
          description: Bad request
        "403":
          description: Forbidden

  /api/jobs/{id}/screening-questions/{qid}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: qid
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Get one screening question
    patch:
      summary: Update a screening question
    delete:
      summary: Delete a screening question
      responses:
        "200":
          description: Deleted
        "404":
          description: Not found

  /api/apply/{slug}:
    parameters:
      - name: slug
        in: path
        required: true
        schema: { type: string }
        description: Organisation slug
    get:
      security: []
      summary: Public apply page bootstrap (open jobs, optional pre-screen for one job)
      parameters:
        - name: job
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: When set, response includes `screeningQuestions` for that open job (id, questionText, sortOrder)
      responses:
        "200":
          description: "{ organisation, jobs, screeningQuestions? }"
        "404":
          description: Company not found
        "429":
          description: Rate limited

  /api/apply:
    post:
      security: []
      summary: Public CV apply (multipart)
      description: |
        Same-origin CSRF; rate limit. When `jobId` is set and the job has knockout questions,
        `screeningAnswers` must be a JSON string array of { questionId, answerYes }.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, slug]
              properties:
                file: { type: string, format: binary }
                slug: { type: string }
                jobId: { type: string, format: uuid }
                name: { type: string }
                phone: { type: string }
                email: { type: string }
                ref: { type: string }
                source: { type: string }
                screeningAnswers:
                  { type: string, description: "JSON string; array of { questionId, answerYes }" }
      responses:
        "200":
          description: Success; parse/score flags in body
        "400":
          description: Bad input, screening incomplete, or invalid target job
        "403":
          description: Screening not passed, or cooling off
        "404":
          description: Company not found
        "429":
          description: Rate limited
        "500":
          description: Server error

components:
  schemas:
    ScreeningAnswerItem:
      type: object
      required: [questionId, answerYes]
      properties:
        questionId: { type: string, format: uuid }
        answerYes:
          { type: boolean, description: "For fail_on_yes questions, true may reject the candidate" }
    CreateApplicationRequest:
      type: object
      required: [jobId]
      properties:
        jobId: { type: string, format: uuid }
        fitScoreId: { type: string, format: uuid }
        interest: { type: string, enum: [interested, strong_interest], default: interested }
        coverNote: { type: string, maxLength: 2000 }
        source: { type: string, maxLength: 64 }
        confidentialApply: { type: boolean, default: false }
        screeningAnswers:
          type: array
          items: { $ref: "#/components/schemas/ScreeningAnswerItem" }
    CreateJobScreeningQuestion:
      type: object
      required: [questionText]
      properties:
        questionText: { type: string, minLength: 1, maxLength: 2000 }
        failOnYes:
          {
            type: boolean,
            default: true,
            description: "If true, Yes knocks out; if false, No knocks out",
          }
        sortOrder: { type: integer }
        isActive: { type: boolean, default: true }
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: sb-access-token
      description: Supabase session cookie (set by auth)

security:
  - session: []
