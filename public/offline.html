<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline — TigerHire</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: #fafafa;
        color: #333;
        text-align: center;
        padding: 24px;
      }
      .container {
        max-width: 400px;
      }
      .icon {
        font-size: 64px;
        margin-bottom: 16px;
      }
      h1 {
        font-size: 24px;
        margin-bottom: 8px;
      }
      p {
        color: #666;
        margin-bottom: 24px;
        line-height: 1.5;
      }
      button {
        padding: 12px 24px;
        background: #f97316;
        color: #fff;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover {
        background: #ea580c;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="icon">🐯</div>
      <h1>You're Offline</h1>
      <p>
        It looks like you've lost your internet connection. Please check your network and try again.
      </p>
      <button onclick="window.location.reload()">Retry</button>
    </div>
  </body>
</html>
