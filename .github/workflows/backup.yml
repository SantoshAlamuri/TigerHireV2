name: Daily Database Backup

on:
  schedule:
    - cron: "0 3 * * *" # Daily at 3 AM UTC
  workflow_dispatch: # Allow manual trigger

jobs:
  backup:
    name: Backup Tables and Storage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - run: npm ci

      - name: Run backup
        env:
          BACKUP_SUPABASE_URL: ${{ secrets.BACKUP_SUPABASE_URL }}
          BACKUP_PROJECT_REF: ${{ secrets.BACKUP_PROJECT_REF }}
          BACKUP_SERVICE_ROLE_KEY: ${{ secrets.BACKUP_SERVICE_ROLE_KEY }}
        run: node scripts/backup-database.mjs

      - name: Upload backup artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: db-backup-${{ github.run_id }}
          path: backups/
          retention-days: 30
