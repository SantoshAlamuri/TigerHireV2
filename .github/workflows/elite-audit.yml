name: Elite audit

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: elite-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  elite-audit:
    name: Composite quality score (rate:ci)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run rate:ci
